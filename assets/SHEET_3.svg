<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1260 891"><g font-family="Tahoma, sans-serif"><rect x="0" y="0" width="1260" height="891" rx="0" fill="white" stroke="white" stroke-width=".8"/><rect x="20" y="20" width="1220" height="851" rx="0" fill="none" stroke="#3b5360" stroke-width=".8"/><text x="38" y="46" font-size="18" fill="#203541">FABRICATION DETAILS — JOINTS, DOOR &amp; GLAZING</text><text x="38" y="69" font-size="11" fill="#a34324">FOR QUOTATION ONLY — NOT APPROVED FOR FABRICATION</text><text x="920" y="69" font-size="10" fill="#203541">ALL DIMENSIONS IN mm / DO NOT SCALE</text><line x1="20" y1="85" x2="1240" y2="85" stroke="#3b5360" stroke-width=".8" /><text x="38" y="742" font-size="9" fill="#203541">1. All dimensions are in millimeters unless otherwise specified.</text><text x="38" y="757" font-size="9" fill="#203541">2. SPCC cold-rolled steel, thickness 0.8 mm.</text><text x="38" y="772" font-size="9" fill="#203541">3. Verify bend radius, K-factor and machine tooling before fabrication.</text><text x="38" y="787" font-size="9" fill="#203541">4. Confirm hinge selection, door clearance and swing envelope.</text><text x="665" y="742" font-size="9" fill="#203541">5. Confirm glazing retention method and hardware specifications.</text><text x="665" y="757" font-size="9" fill="#203541">6. Verify weld details and manufacturing tolerances.</text><text x="665" y="772" font-size="9" fill="#203541">7. For quotation purposes only — not approved for fabrication.</text><line x1="20" y1="801" x2="1240" y2="801" stroke="#3b5360" stroke-width=".8" /><line x1="20" y1="836" x2="1240" y2="836" stroke="#3b5360" stroke-width=".8" /><line x1="600" y1="801" x2="600" y2="871" stroke="#3b5360" stroke-width=".8" /><line x1="870" y1="801" x2="870" y2="871" stroke="#3b5360" stroke-width=".8" /><line x1="1080" y1="801" x2="1080" y2="871" stroke="#3b5360" stroke-width=".8" /><text x="32" y="814" font-size="8" fill="#203541">PROJECT</text><text x="32" y="830" font-size="12" fill="#203541">FIRE EXTINGUISHER CABINET V1</text><text x="32" y="849" font-size="8" fill="#203541">DRAWING STATUS</text><text x="32" y="865" font-size="11" fill="#203541">FOR QUOTATION ONLY</text><text x="612" y="814" font-size="8" fill="#203541">MATERIAL</text><text x="612" y="830" font-size="11" fill="#203541">SPCC STEEL, 0.8 mm</text><text x="612" y="849" font-size="8" fill="#203541">DRAWING NUMBER</text><text x="612" y="865" font-size="11" fill="#203541">FEC-V1-DT-003</text><text x="882" y="814" font-size="8" fill="#203541">SHEET SIZE / UNITS</text><text x="882" y="830" font-size="11" fill="#203541">A3 LANDSCAPE / mm</text><text x="882" y="849" font-size="8" fill="#203541">SCALE</text><text x="882" y="865" font-size="10" fill="#203541">NTS — DO NOT SCALE</text><text x="1092" y="814" font-size="8" fill="#203541">REVISION</text><text x="1092" y="830" font-size="12" fill="#203541">P3.2</text><text x="1092" y="849" font-size="8" fill="#203541">SHEET</text><text x="1092" y="865" font-size="12" fill="#203541">3 OF 3</text><text x="38" y="108" font-size="12" fill="#a34324">CONCEPT DETAILS / NTS — SUBJECT TO FABRICATOR VERIFICATION</text><line x1="630" y1="122" x2="630" y2="714" stroke="#3b5360" stroke-width=".8" /><line x1="30" y1="390" x2="1230" y2="390" stroke="#3b5360" stroke-width=".8" /><text x="38" y="137" font-size="14" fill="#203541">A — PART 04 / CABINET ASSEMBLY</text><rect x="50" y="164" width="120" height="180" rx="0" fill="#f3e8da" stroke="#3b5360" stroke-width=".8"/><rect x="55.4" y="169.4" width="109.2" height="169.2" rx="0" fill="white" stroke="#3b5360" stroke-width=".8"/><line x1="50" y1="162" x2="50" y2="150" stroke="#3b5360" stroke-width=".8" /><line x1="170" y1="162" x2="170" y2="150" stroke="#3b5360" stroke-width=".8" /><line x1="50" y1="154" x2="170" y2="154" stroke="#3b5360" stroke-width=".8" /><path d="M50,154 l4,-1.3 v2.6 Z M170,154 l-4,-1.3 v2.6 Z" fill="#3b5360"/><text x="100.0" y="148" font-size="10" fill="#203541">400</text><line x1="52" y1="164" x2="40" y2="164" stroke="#3b5360" stroke-width=".8" /><line x1="52" y1="344" x2="40" y2="344" stroke="#3b5360" stroke-width=".8" /><line x1="36" y1="164" x2="36" y2="344" stroke="#3b5360" stroke-width=".8" /><path d="M36,164 l-1.3,4 h2.6 Z M36,344 l-1.3,-4 h2.6 Z" fill="#3b5360"/><text x="29" y="254.0" font-size="10" text-anchor="middle" transform="rotate(-90 29 254.0)">700</text><text x="185" y="181" font-size="11" fill="#203541">PART 04: ONE-PIECE CUT FRAME</text><text x="185" y="201" font-size="10" fill="#203541">364 × 664 opening; (400 - 364)/2 = 18.</text><text x="185" y="219" font-size="10" fill="#203541">No frame corner splices; no bends.</text><text x="185" y="237" font-size="10" fill="#203541">Frame inner edge X/Z = 18 from perimeter.</text><text x="185" y="255" font-size="10" fill="#203541">Edge contact with PART 01 / 02; no lap flange.</text><rect x="222" y="286" width="4" height="42" rx="0" fill="#c37766" stroke="#3b5360" stroke-width=".8"/><rect x="226" y="306" width="235" height="4" rx="0" fill="#8eafb7" stroke="#3b5360" stroke-width=".8"/><rect x="461" y="286" width="4" height="42" rx="0" fill="#c37766" stroke="#3b5360" stroke-width=".8"/><line x1="226" y1="303" x2="235" y2="294" stroke="#3b5360" stroke-width=".8" /><line x1="461" y1="303" x2="452" y2="294" stroke="#3b5360" stroke-width=".8" /><text x="190" y="280" font-size="9" fill="#203541">04 FRONT</text><text x="294" y="296" font-size="9" fill="#203541">01 / 02 EDGE</text><text x="450" y="280" font-size="9" fill="#203541">03 REAR</text><line x1="222" y1="326" x2="222" y2="342" stroke="#3b5360" stroke-width=".8" /><line x1="465" y1="326" x2="465" y2="342" stroke="#3b5360" stroke-width=".8" /><line x1="222" y1="346" x2="465" y2="346" stroke="#3b5360" stroke-width=".8" /><path d="M222,346 l4,-1.3 v2.6 Z M465,346 l-4,-1.3 v2.6 Z" fill="#3b5360"/><text x="333.5" y="340" font-size="10" fill="#203541">DEPTH 200</text><text x="185" y="370" font-size="10" fill="#203541">Depth stack: 0.8 + 198.4 + 0.8 = 200.</text><text x="650" y="137" font-size="14" fill="#203541">B — PART 05 / FLANGED EDGE &amp; RELIEF</text><path d="M674,177 H822 A18,18 0 0 1 840,195 V281 H832 V195 A10,10 0 0 0 822,185 H674 Z" fill="#d6e4e7" stroke="#3b5360"/><line x1="842" y1="177" x2="870" y2="177" stroke="#3b5360" stroke-width=".8" /><line x1="842" y1="281" x2="870" y2="281" stroke="#3b5360" stroke-width=".8" /><line x1="866" y1="177" x2="866" y2="281" stroke="#3b5360" stroke-width=".8" /><path d="M866,177 l-1.3,4 h2.6 Z M866,281 l-1.3,-4 h2.6 Z" fill="#3b5360"/><text x="859" y="229.0" font-size="10" text-anchor="middle" transform="rotate(-90 859 229.0)">15 OUTSIDE</text><text x="680" y="214" font-size="10" fill="#203541">t = 0.8</text><text x="680" y="233" font-size="10" fill="#203541">INSIDE R1.0</text><text x="680" y="252" font-size="10" fill="#203541">90° TO REAR</text><text x="896" y="175" font-size="11" fill="#203541">FLAT CORNER / 4X</text><path d="M915,194 H974 V227 H1007 V290 H915 Z" fill="#e0eeeb" stroke="#3b5360"/><line x1="966" y1="194" x2="966" y2="290" stroke="#bf652c" stroke-width=".8" stroke-dasharray="4 3"/><line x1="915" y1="235" x2="1007" y2="235" stroke="#bf652c" stroke-width=".8" stroke-dasharray="4 3"/><text x="1022" y="207" font-size="10" fill="#203541">Square relief:</text><text x="1022" y="225" font-size="10" fill="#203541">15.773 × 15.773</text><text x="1022" y="245" font-size="10" fill="#203541">CL offset 14.237</text><text x="1022" y="263" font-size="10" fill="#203541">from cut edge.</text><text x="896" y="311" font-size="10" fill="#203541">Relief extends 0.5 mm beyond the nominal bend tangent.</text><text x="650" y="336" font-size="10" fill="#203541">360 × 660 door in 364 × 664 opening: nominal gap 2 per side.</text><text x="650" y="355" font-size="10" fill="#203541">Verify relief, bend sequence, tooling access and corner closure.</text><text x="650" y="374" font-size="10" fill="#203541">Hinge axis / fixing REF only; swing and latch interference unverified.</text><text x="38" y="414" font-size="14" fill="#203541">C — REAR-MOUNTED GLASS / EDGE SECTION</text><text x="38" y="434" font-size="10" fill="#203541">200 × 420 R15 aperture / 220 × 440 × 2 glass / overlap 10.</text><rect x="60" y="465" width="168" height="8" rx="0" fill="#c37766" stroke="#3b5360" stroke-width=".8"/><rect x="100" y="473" width="80" height="10" rx="0" fill="#444" stroke="#3b5360" stroke-width=".8"/><rect x="90" y="483" width="310" height="20" rx="0" fill="#dcecf3" stroke="#3b5360" stroke-width=".8"/><rect x="106" y="503" width="55" height="8" rx="0" fill="#777" stroke="#3b5360" stroke-width=".8"/><path d="M66,475 V525 H143 V511" fill="none" stroke="#627984" stroke-width="4"/><line x1="68" y1="457" x2="68" y2="490" stroke="#3b5360" stroke-width=".8" /><text x="270" y="469" font-size="10" fill="#203541">DOOR STEEL 0.8</text><text x="270" y="526" font-size="10" fill="#203541">GLASS 2 / PADDED RETAINER</text><line x1="90" y1="501" x2="90" y2="542" stroke="#3b5360" stroke-width=".8" /><line x1="228" y1="501" x2="228" y2="542" stroke="#3b5360" stroke-width=".8" /><line x1="90" y1="546" x2="228" y2="546" stroke="#3b5360" stroke-width=".8" /><path d="M90,546 l4,-1.3 v2.6 Z M228,546 l-4,-1.3 v2.6 Z" fill="#3b5360"/><text x="149.0" y="540" font-size="10" fill="#203541">10 OVERLAP</text><text x="42" y="568" font-size="9" fill="#203541">FRONT ABOVE / CABINET INTERIOR BELOW</text><text x="38" y="590" font-size="10" fill="#203541">Gasket concept: t = 1, width 8; outer 218 × 438, inner 202 × 422.</text><text x="38" y="609" font-size="10" fill="#203541">1 nominal edge setback each side of strip on straight edges.</text><text x="38" y="628" font-size="10" fill="#203541">Nominal stack: steel 0.8 + gasket 1 + glass 2 = 3.8 before compression.</text><text x="38" y="647" font-size="10" fill="#203541">Padded clips / lower support: no direct metal-to-glass contact.</text><text x="38" y="666" font-size="10" fill="#203541">Clip count, studs / screws, backing pads and edge finish: VERIFY.</text><text x="38" y="685" font-size="10" fill="#203541">Verify R15 corner coverage, retention load and glass safety type.</text><text x="38" y="704" font-size="10" fill="#203541">Glass grade / safety compliance NOT established. Do not drill glass.</text><text x="650" y="414" font-size="14" fill="#203541">D — JOINTS, OFFCUTS &amp; QUOTATION HOLD POINTS</text><text x="650" y="440" font-size="10" fill="#203541">Assembly datum: X width, Y front-to-rear, Z height; all from outside.</text><text x="650" y="459" font-size="10" fill="#203541">04: Y0–0.8; 01 / 02: Y0.8–199.2; 03: Y199.2–200.</text><text x="650" y="478" font-size="10" fill="#203541">01: Z0–699.2; 02: Z699.2–700. Nominal steel envelope: 400 × 700 × 200 mm.</text><text x="650" y="497" font-size="10" fill="#203541">05: X20–380, Z20–680, Y0–15. Hardware projection is unverified.</text><text x="650" y="516" font-size="10" fill="#203541">Proposed thin-sheet edge welds: 02 to both 01 side edges;</text><text x="650" y="535" font-size="10" fill="#203541">04 / 03 to body perimeter. No overlap / spot-weld flanges provided.</text><text x="650" y="554" font-size="10" fill="#203541">Joint lengths: top 0.3968 m; front 2.2 m; rear 2.2 m (not weld lengths).</text><text x="650" y="573" font-size="10" fill="#203541">Fabricator to select weld process, stitch size / pitch, sequence and finish.</text><text x="650" y="592" font-size="10" fill="#203541">Confirm rounded body corner gaps, distortion, sealing and tolerances.</text><text x="650" y="611" font-size="10" fill="#203541">Potential offcut rectangles after separation cuts (assumed kerf 1):</text><text x="650" y="630" font-size="10" fill="#203541">2420 × 285; 620 × 908; 570 × 485; frame core approx. 362 × 662.</text><text x="650" y="649" font-size="10" fill="#203541">Glazing cutout offcut: approx. 198 × 418 R14; rectangle 198 × 388.</text><text x="650" y="668" font-size="10" fill="#203541">Offcuts are subsets of non-product area; cutting plan must be verified.</text><text x="650" y="687" font-size="10" fill="#203541">Confirm actual kerf, lead-ins, hold-downs, coating allowance and fit.</text></g></svg>